name: i18n Completeness Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  i18n-check:
    name: Check zh-TW key parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run i18n completeness check
        run: node scripts/check-i18n-completeness.js
